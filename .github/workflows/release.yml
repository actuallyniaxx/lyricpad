name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:win

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Lyricpad-win32-x64/*" -DestinationPath "Lyricpad-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyricpad-win-x64
          path: Lyricpad-win-x64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Lyricpad-win-x64.zip
          generate_release_notes: true
